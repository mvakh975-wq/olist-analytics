version: 2

models:
  - name: stg_orders
    description: One row per order with typed timestamps.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]
      - name: estimated_delivery_at
        data_tests: [not_null]

  - name: stg_order_items
    description: One row per item in an order.
    data_tests:
      - unique_combination:
          arguments: {columns: [order_id, order_item_id]}
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_orders'), field: order_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_products'), field: product_id}
      - name: seller_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_sellers'), field: seller_id}
      - name: price
        data_tests: [not_null]

  - name: stg_order_payments
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_orders'), field: order_id}

  - name: stg_order_reviews
    description: One row per (review, order) pair.
    data_tests:
      - unique_combination:
          arguments: {columns: [review_id, order_id]}
    columns:
      - name: review_score
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5], quote: false}

  - name: stg_customers
    description: One row per customer_id (which is unique per order); the person is customer_unique_id.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_products
    description: Products with an English category name, falling back to Portuguese, then 'unknown'.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]

  - name: stg_category_translation
    columns:
      - name: category_name_pt
        data_tests: [unique, not_null]
