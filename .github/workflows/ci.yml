name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run sqlfluff lint dbt/models dbt/tests
      - name: dbt build on the fixture sample
        env:
          OLIST_DB: ci.duckdb
        run: uv run dbt build --project-dir dbt --profiles-dir dbt --vars "{raw_dir: tests/fixtures/raw}"
      - name: Tests
        run: uv run pytest
