[project]
name = "olist-analytics"
version = "0.1.0"
description = "E-commerce analytics on the Olist dataset: dbt + DuckDB models, statistical analysis, Observable Framework dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=3.2",
    "jupytext>=1.16",
    "nbconvert>=7",
    "ipykernel>=6",
    "matplotlib>=3.9",
    "playwright>=1.47",
    "jupyterlab>=4.6.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# inline SQL in tests and notebooks reads better unwrapped
"tests/*" = ["E501"]
"notebooks/*" = ["E501", "B018"]  # last expression of a cell is its output
